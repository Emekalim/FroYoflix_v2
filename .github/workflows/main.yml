  build-macos-x64:
    runs-on: macos-15-intel

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Setuptools for Python (macOS only)
        run: pip3 install setuptools --break-system-packages

      - name: Download macOS media binaries
        run: ./scripts/download-macos-media-binaries.sh

      - name: Install dependencies
        run: |
          cd electron
          pnpm install --frozen-lockfile

      - name: Build x64 app bundle
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cd electron
          pnpm run web:build
          pnpm exec electron-builder --mac dir --x64 --publish never

      - name: Archive x64 app bundle
        run: |
          mkdir -p artifacts
          tar -C electron/dist/mac -czf artifacts/froyo-mac-x64-app.tar.gz FroYo.app

      - name: Upload x64 app bundle
        uses: actions/upload-artifact@v4
        with:
          name: froyo-mac-x64-app
          path: artifacts/froyo-mac-x64-app.tar.gz
          if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Setuptools for Python (macOS only)
        run: pip3 install setuptools --break-system-packages

      - name: Download macOS media binaries
        run: ./scripts/download-macos-media-binaries.sh

      - name: Install dependencies
        run: |
          cd electron
          pnpm install --frozen-lockfile

      - name: Build arm64 app bundle
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cd electron
          pnpm run web:build
          pnpm exec electron-builder --mac dir --arm64 --publish never

      - name: Archive arm64 app bundle
        run: |
          mkdir -p artifacts
          tar -C electron/dist/mac-arm64 -czf artifacts/froyo-mac-arm64-app.tar.gz FroYo.app

      - name: Upload arm64 app bundle
        uses: actions/upload-artifact@v4
        with:
          name: froyo-mac-arm64-app
          path: artifacts/froyo-mac-arm64-app.tar.gz
          if-no-files-found: error

  release-macos:
    runs-on: macos-latest
    needs:
      - build-macos-x64
      - build-macos-arm64

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Download macOS media binaries
        run: ./scripts/download-macos-media-binaries.sh

      - name: Install dependencies
        run: |
          cd electron
          pnpm install --frozen-lockfile

      - name: Download x64 app bundle
        uses: actions/download-artifact@v4
        with:
          name: froyo-mac-x64-app
          path: artifacts

      - name: Download arm64 app bundle
        uses: actions/download-artifact@v4
        with:
          name: froyo-mac-arm64-app
          path: artifacts

      - name: Extract app bundles
        run: |
          mkdir -p merge/x64 merge/arm64
          tar -C merge/x64 -xzf artifacts/froyo-mac-x64-app.tar.gz
          tar -C merge/arm64 -xzf artifacts/froyo-mac-arm64-app.tar.gz

      - name: Merge universal app
        run: node scripts/merge-macos-universal.mjs merge/x64/FroYo.app merge/arm64/FroYo.app electron/dist/mac-universal/FroYo.app

      - name: Ensure GitHub release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes ""

      - name: Package and publish universal zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          pnpm exec electron-builder --mac zip --universal --prepackaged dist/mac-universal/FroYo.app -p never
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/mac-FroYo-v${GITHUB_REF_NAME#v}.zip" \
            "dist/mac-FroYo-v${GITHUB_REF_NAME#v}.zip.blockmap" \
            "dist/latest-mac.yml" \
            --clobber

  publish-release-notes:
    runs-on: ubuntu-latest
    needs:
      - release-macos
    if: ${{ always() && needs.release-macos.result == 'success' }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Extract release notes from changelog
        run: node scripts/extract-release-notes.mjs "${RELEASE_TAG#v}" > release-notes.md

      - name: Update GitHub release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --notes-file release-notes.md
